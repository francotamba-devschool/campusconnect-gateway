# Identifiant utilise par Eureka et Config Server.
spring.application.name=gateway

# Charge la configuration distante (gateway-dev.yml) depuis Config Server.
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Depuis l'IDE : dev. Dans Docker Compose : dev,docker.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Expose l'endpoint de sante pour verification.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
