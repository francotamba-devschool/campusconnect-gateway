services:
  gateway:
    build: .
    container_name: campus-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      CONFIG_SERVER_URL: http://config-server:8888
    restart: on-failure
    networks:
      - campus-net

networks:
  campus-net:
    external: true
